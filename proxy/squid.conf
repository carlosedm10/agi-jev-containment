# Egress proxy for agentnet. Per-run tokens live in /proxy/tokens (mounted from
# ./proxy/tokens) — one "user:token" per line; deleting a line revokes that
# run's egress, which is the L3 playbook step (docs/Actions.md).

http_port 3128

auth_param basic program /proxy/auth.sh /proxy/tokens
auth_param basic realm hackspain-egress
auth_param basic children 2
# Short TTL so L3 revocation (deleting a tokens line) bites within ~30s —
# Squid caches validated creds for this long before re-checking the helper.
auth_param basic credentialsttl 30 seconds

acl authenticated proxy_auth REQUIRED
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow authenticated
http_access deny all

# Second capture channel: every CONNECT/GET lands here. Squid workers and
# helpers all run as the 'proxy' user, which cannot open container stdout —
# so log to a file and read it host-side via `docker exec ... tail -f`.
access_log daemon:/var/log/squid/access.log squid
