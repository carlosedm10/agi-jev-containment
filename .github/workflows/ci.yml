name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env from template
        run: cp .env_template .env

      - name: Build
        run: make build

      - name: Up
        run: make up

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Down
        if: always()
        run: make down
